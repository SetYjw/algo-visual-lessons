<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>算法演示教学目录 · Algo Visual Lessons</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@500;700&display=swap">
<style>
:root {
  --bg: #EEF1F6;
  --panel: #FFFFFF;
  --sunk: #F5F7FA;
  --ink: #18202E;
  --muted: #5C6779;
  --line: #D9DFE8;
  --line-strong: #A9B3C3;
  --accent: #2B57E0;
  --accent-soft: #E1E8FC;
  --on-accent: #FFFFFF;
  --ok: #17905F;
  --ok-soft: #DAF1E6;
  --purple: #7A42D9;
  --purple-soft: #EFE6FD;
  --shadow: 0 3px 14px rgba(24, 32, 46, 0.06);
  --font-ui: "IBM Plex Sans", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
  --font-display: "Space Grotesk", "PingFang SC", "Microsoft YaHei", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1219; --panel: #161C26; --sunk: #11161F; --ink: #E5EAF2; --muted: #93A0B4;
    --line: #273041; --line-strong: #435069; --accent: #7C9BFF; --accent-soft: #1D2847; --on-accent: #0A1020;
    --ok: #3FC58F; --ok-soft: #123326; --purple: #B894FF; --purple-soft: #281D42;
    --shadow: 0 4px 18px rgba(0, 0, 0, 0.35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1219; --panel: #161C26; --sunk: #11161F; --ink: #E5EAF2; --muted: #93A0B4;
  --line: #273041; --line-strong: #435069; --accent: #7C9BFF; --accent-soft: #1D2847; --on-accent: #0A1020;
  --ok: #3FC58F; --ok-soft: #123326; --purple: #B894FF; --purple-soft: #281D42;
  --shadow: 0 4px 18px rgba(0, 0, 0, 0.35);
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-ui);
  line-height: 1.65;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

.topbar {
  position: sticky; top: 0; z-index: 40;
  background: color-mix(in srgb, var(--panel) 88%, transparent);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--line);
}
.topbar-inner {
  max-width: 1180px; margin: 0 auto; padding: 12px 20px;
  display: flex; align-items: center; justify-content: space-between; gap: 14px;
}
.brand { display: flex; align-items: center; gap: 11px; text-decoration: none; color: inherit; }
.brand-badge {
  width: 34px; height: 34px; border-radius: 9px;
  background: linear-gradient(135deg, var(--accent), var(--purple));
  color: #fff; display: grid; place-items: center;
  font-family: var(--font-display); font-weight: 700; font-size: 14px;
}
.brand h1 { font-family: var(--font-display); font-size: 17px; margin: 0; line-height: 1.2; }
.brand p { margin: 0; font-size: 11.5px; color: var(--muted); }

.top-actions { display: flex; align-items: center; gap: 8px; }
.btn-ghost {
  text-decoration: none; font-size: 12.5px; font-weight: 500;
  background: var(--sunk); color: var(--ink);
  border: 1px solid var(--line-strong); border-radius: 7px;
  padding: 6px 11px; cursor: pointer; font-family: inherit;
}
.btn-ghost:hover { border-color: var(--accent); color: var(--accent); }

.wrap {
  max-width: 1180px; width: 100%; margin: 0 auto;
  padding: 28px 20px 64px; flex: 1;
}

.hero {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 26px 28px;
  box-shadow: var(--shadow);
  margin-bottom: 22px;
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  gap: 20px;
  flex-wrap: wrap;
}
.hero h2 {
  font-family: var(--font-display);
  font-size: 26px;
  margin: 0 0 8px;
  line-height: 1.25;
}
.hero p { margin: 0; color: var(--muted); max-width: 660px; font-size: 14.5px; }
.hero-stats { display: flex; gap: 10px; flex-wrap: wrap; }
.stat-chip {
  background: var(--sunk); border: 1px solid var(--line);
  border-radius: 10px; padding: 8px 14px; text-align: center; min-width: 88px;
}
.stat-chip .num { font-family: var(--font-mono); font-size: 20px; font-weight: 700; color: var(--accent); line-height: 1.2; }
.stat-chip .lbl { font-size: 11.5px; color: var(--muted); }

.toolbar {
  display: flex; align-items: center; justify-content: space-between;
  gap: 12px; flex-wrap: wrap; margin-bottom: 18px;
}
.cat-tabs { display: flex; gap: 6px; flex-wrap: wrap; }
.cat-tab {
  border: 1px solid var(--line-strong); background: var(--panel); color: var(--muted);
  border-radius: 999px; padding: 5px 13px; font-size: 13px; font-weight: 500; cursor: pointer;
}
.cat-tab:hover { border-color: var(--accent); color: var(--ink); }
.cat-tab.on { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }

.search-box {
  font-family: inherit; font-size: 13.5px;
  background: var(--panel); color: var(--ink);
  border: 1px solid var(--line-strong); border-radius: 8px;
  padding: 7px 12px; width: 250px; outline: none;
}
.search-box:focus { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
  gap: 16px;
}
.card {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 20px;
  box-shadow: var(--shadow);
  display: flex;
  flex-direction: column;
  gap: 11px;
  transition: transform .16s ease, border-color .16s ease;
}
.card:hover { transform: translateY(-2px); border-color: var(--accent); }
.card-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.badge {
  font-family: var(--font-mono); font-size: 11px; font-weight: 700;
  padding: 2px 8px; border-radius: 5px;
}
.badge.cat { background: var(--accent-soft); color: var(--accent); }
.badge.lv { background: var(--ok-soft); color: var(--ok); }

.card h3 { font-family: var(--font-display); font-size: 18px; margin: 0; line-height: 1.35; }
.card .sub { margin: 0; font-size: 13px; color: var(--muted); }
.card ul { margin: 2px 0; padding-left: 18px; font-size: 13px; color: var(--ink); flex: 1; }
.card li { margin-bottom: 4px; }
.tags { display: flex; gap: 5px; flex-wrap: wrap; }
.tag {
  font-family: var(--font-mono); font-size: 11px;
  background: var(--sunk); border: 1px solid var(--line);
  color: var(--muted); padding: 2px 7px; border-radius: 5px;
}
.card-foot {
  display: flex; align-items: center; justify-content: space-between;
  padding-top: 10px; border-top: 1px solid var(--line); gap: 10px;
}
.date { font-family: var(--font-mono); font-size: 11.5px; color: var(--muted); }
.open-btn {
  text-decoration: none;
  background: var(--accent); color: var(--on-accent);
  font-size: 13px; font-weight: 600; padding: 7px 14px;
  border-radius: 8px; transition: filter .15s;
}
.open-btn:hover { filter: brightness(1.08); }

.card.placeholder {
  border-style: dashed;
  background: color-mix(in srgb, var(--panel) 60%, var(--bg));
  justify-content: center;
  align-items: center;
  text-align: center;
  color: var(--muted);
  min-height: 240px;
}
.card.placeholder:hover { transform: none; border-color: var(--line-strong); }

footer {
  text-align: center; padding: 18px 20px; font-size: 12.5px;
  color: var(--muted); border-top: 1px solid var(--line);
}
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="./index.html">
      <div class="brand-badge">AL</div>
      <div>
        <h1>Algo Visual Lessons</h1>
        <p>交互式算法演示与微课合集</p>
      </div>
    </a>
    <div class="top-actions">
      <a class="btn-ghost" href="https://github.com/SetYjw/algo-visual-lessons" target="_blank" rel="noreferrer">GitHub 仓库 ↗</a>
      <button class="btn-ghost" id="themeToggle">🌓 主题</button>
    </div>
  </div>
</header>

<main class="wrap">
  <section class="hero">
    <div>
      <h2>算法演示教学目录</h2>
      <p>面向算法与数据结构学习者的交互式微课合集：每一讲都包含零基础通俗讲解、实时可交互动画演练、随堂小测以及经典 C++ 题解。所有课程纯前端运行，持续更新中。</p>
    </div>
    <div class="hero-stats">
      <div class="stat-chip"><div class="num" id="statLessons">0</div><div class="lbl">已上线微课</div></div>
      <div class="stat-chip"><div class="num" id="statCats">0</div><div class="lbl">专题分类</div></div>
    </div>
  </section>

  <section class="toolbar">
    <div class="cat-tabs" id="catTabs"></div>
    <input class="search-box" id="searchInput" type="search" placeholder="搜索算法、标签、题号 (如 AVL / P3369)...">
  </section>

  <section class="grid" id="lessonGrid"></section>
</main>

<footer>
  维护者：SetYjw · 新增演示只需将页面放入 <code>lessons/&lt;slug&gt;/index.html</code> 并在 <code>lessons.js</code> 中注册
</footer>

<script src="./lessons.js"></script>
<script>
document.getElementById('themeToggle').addEventListener('click', () => {
  const cur = document.documentElement.getAttribute('data-theme');
  const isDark = cur === 'dark' || (!cur && window.matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.setAttribute('data-theme', isDark ? 'light' : 'dark');
});

const lessons = window.ALGO_LESSONS || [];
const categories = ['全部', ...new Set(lessons.map(x => x.category))];
let activeCat = '全部';
let query = '';

document.getElementById('statLessons').textContent = lessons.length;
document.getElementById('statCats').textContent = Math.max(0, categories.length - 1);

function renderCats() {
  document.getElementById('catTabs').innerHTML = categories.map(c =>
    `<button class="cat-tab${c === activeCat ? ' on' : ''}" onclick="setCat('${c}')">${c}</button>`
  ).join('');
}

function setCat(c) {
  activeCat = c;
  renderCats();
  renderGrid();
}

function renderGrid() {
  const q = query.trim().toLowerCase();
  const list = lessons.filter(item => {
    const matchCat = activeCat === '全部' || item.category === activeCat;
    const hay = [item.title, item.subtitle, item.category, ...(item.tags || [])].join(' ').toLowerCase();
    return matchCat && (!q || hay.includes(q));
  });

  const cardsHtml = list.map(item => `
    <article class="card">
      <div class="card-top">
        <span class="badge cat">${item.category}</span>
        <span class="badge lv">${item.level}</span>
      </div>
      <h3>${item.title}</h3>
      <p class="sub">${item.subtitle}</p>
      <ul>${(item.highlights || []).map(h => `<li>${h}</li>`).join('')}</ul>
      <div class="tags">${(item.tags || []).map(t => `<span class="tag">${t}</span>`).join('')}</div>
      <div class="card-foot">
        <span class="date">更新于 ${item.updatedAt}</span>
        <a class="open-btn" href="${item.path}">进入微课 →</a>
      </div>
    </article>
  `).join('');

  const placeholderHtml = !q ? `
    <article class="card placeholder">
      <div style="font-size:26px; margin-bottom:4px;">＋</div>
      <div style="font-weight:600; color:var(--ink);">更多算法微课持续扩充中</div>
      <div style="font-size:12.5px; max-width:260px;">线段树、Tarjan 强连通分量、最短路、动态规划等演示教学可随时挂载到此目录</div>
    </article>
  ` : '';

  document.getElementById('lessonGrid').innerHTML = (cardsHtml || '<p style="color:var(--muted);">没有找到匹配的课程。</p>') + placeholderHtml;
}

document.getElementById('searchInput').addEventListener('input', e => {
  query = e.target.value;
  renderGrid();
});

renderCats();
renderGrid();
</script>
</body>
</html>
